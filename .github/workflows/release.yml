name: release
# build-machine: skip test reason=the ci workflow tests the tagged commit on main before the tag is pushed
# build-machine: skip smoke reason=the sidecar has no application to start; its protocol tests run the binary

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # sok sidecar release 는 core 의 같은 version tag 에서 빌드한다.
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/core
          ref: ${{ github.ref_name }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build sok
        run: go build -C core/packages/sok/wailsv3 -o "$RUNNER_TEMP/sok" ./src/cmd/sok
      - name: Build and package
        run: make release GO_FLAGS='-trimpath -ldflags=-s\ -w' SOK="$RUNNER_TEMP/sok" OUT=dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      # registry 에 새 version 을 더하는 pull request 를 연다(core docs/spec/registry.md#releases-of-soksak-components).
      # REGISTRY_TOKEN 은 soksak-app/registry 에 pull request 를 열 수 있는 token 이고, 그 소유자가 작성자다.
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/registry
          path: registry
      - uses: actions/setup-node@v4
        with:
          node-version-file: registry/.node-version
      - name: Add the version to the registry entry
        run: node registry/scripts/add-version.mjs sidecar --registry registry --package . --asset "darwin-arm64=dist/soksak-sidecar-files-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          path: registry
          branch: sidecar-files-${{ github.ref_name }}
          title: Add @soksak/sidecar-files ${{ github.ref_name }}
          commit-message: Add @soksak/sidecar-files ${{ github.ref_name }}
          add-paths: sidecars
